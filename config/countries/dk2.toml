# Price area DK2: Zealand, Lolland-Falster and Bornholm, the municipalities numbered 101 to 400
# in the data of Energinet. The model covers onshore units: offshore wind is published apart.
country = "DK2"
time_zone = "Europe/Copenhagen"
perimeter = "price_area"

# The municipalities of DK2 span 10.87 E to 15.16 E (Bornholm) and 54.56 N to 56.20 N (GISCO LAU
# 2024); the box adds at least one 0.25 degree ERA5 cell on each side.
[era5_box]
west = 10.5
south = 54.25
east = 15.5
north = 56.5

# Energinet's solar capacity reads as AC: the 6.5 GWp that IEA PVPS reports at the end of 2025
# (country page of Denmark, 2025 update) is 1.28 times its 5,067 MW on 1 January 2026, on the 0.01
# steps of precompute.DC_AC_GRID.
[solar]
dc_ac_ratio = 1.28

# No Danish register gives the orientation and tilt of modules: the shares of the German fleet
# (de.toml, from the Marktstammdatenregister) stand in for them.
[[solar.systems]]
tilt = 30.5
azimuth = 180.0
share = 0.277

[[solar.systems]]
tilt = 12.5
azimuth = 180.0
share = 0.2408

[[solar.systems]]
tilt = 52.5
azimuth = 180.0
share = 0.0424

[[solar.systems]]
tilt = 27.2
azimuth = 225.0
share = 0.1195

[[solar.systems]]
tilt = 26.2
azimuth = 135.0
share = 0.0934

[[solar.systems]]
tilt = 22.0
azimuth = 270.0
share = 0.116

[[solar.systems]]
tilt = 21.2
azimuth = 90.0
share = 0.1109

# Onshore turbines in operation at the end of 2025 by grid connection window
# (ens.wind_generations, register of the Danish Energy Agency): hub heights weighted by capacity,
# and the curve of wind.turbines() closest in specific power: 413 and 383 W m-2 up to 2012 (EWT
# 1 MW, 379), 321 from 2013 (V82, 312).

[[wind_onshore.generations]]
turbine = "EWT_DW58_1MW_58"
hub_height_m = 41.8
last_commissioning_year = 2000

[[wind_onshore.generations]]
turbine = "EWT_DW58_1MW_58"
hub_height_m = 69.7
last_commissioning_year = 2012

[[wind_onshore.generations]]
turbine = "VestasV82_1.65MW_82"
hub_height_m = 89.7

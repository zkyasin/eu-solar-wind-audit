[project]
name = "eu-solar-wind-audit"
version = "0.0.0"
description = "Checks how comparable published solar and wind production data are across Europe, against a weather-based reference."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "gcsfs>=2026.10.1",
    "httpx>=0.28.1",
    "icechunk>=2.3.1",
    "numcodecs[pcodec]>=0.17.1",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pandera>=0.36.0",
    "pyarrow>=26.0.1",
    "xarray>=2026.9.0",
    "zarr>=3.4.2",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "commitizen>=4.19.4",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM", "PT", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
major_version_zero = true
